<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>INFOCO TV MUSIC</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#070707;
font-family:Arial, Helvetica, sans-serif;
color:white;
}

header{
height:80px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 30px;
border-bottom:1px solid #1f1f1f;
background:#090909;
}

.logo{
font-size:32px;
font-weight:bold;
color:#9c27ff;
}

.slogan{
font-size:14px;
color:#999;
}

.main{
display:grid;
grid-template-columns: 2fr 1fr;
gap:20px;
padding:20px;
}

.video-area{
background:#0d0d0d;
border:2px solid #9c27ff;
border-radius:25px;
height:700px;
display:flex;
align-items:center;
justify-content:center;
font-size:40px;
font-weight:bold;
color:white;
}

.sidebar{
background:#111;
border-radius:25px;
padding:20px;
}

.sidebar h2{
margin-bottom:20px;
color:#bb86fc;
}

.chat-box{
height:400px;
background:#080808;
border:1px solid #222;
border-radius:15px;
padding:15px;
overflow:auto;
margin-bottom:20px;
}

.chat-msg{
margin-bottom:10px;
padding:10px;
background:#1a1a1a;
border-radius:10px;
}

.btn{
width:100%;
padding:15px;
margin-bottom:10px;
border:none;
border-radius:12px;
background:#9c27ff;
color:white;
font-size:16px;
cursor:pointer;
}

.banner{
margin:20px;
height:120px;
border:2px solid #9c27ff;
border-radius:20px;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
font-weight:bold;
background:#111;
}

footer{
text-align:center;
padding:20px;
color:#777;
}

@media(max-width:900px){

.main{
grid-template-columns:1fr;
}

.video-area{
height:500px;
}

}

</style>
</head>

<body>

<header>

<div>
<div class="logo">INFOCO TV MUSIC</div>
<div class="slogan">Sua Rádio Online 24h</div>
</div>

</header>

<div class="main">

<div class="video-area">
VÍDEO 9:16
</div>

<div class="sidebar">

<h2>💬 CHAT AO VIVO</h2>

<div class="chat-box">

<div class="chat-msg">
Bem-vindo à INFOCO TV MUSIC.
</div>

</div>

<button class="btn">🎬 ENVIAR VÍDEO</button>

<button class="btn">🎵 ENVIAR MÚSICA</button>

<button class="btn">⭐ COMPRAR CRÉDITOS</button>

</div>

</div>

<div class="banner">
INFOCO ADS
</div>

<footer>
© INFOCO TV MUSIC
</footer>

</body>
</html>
