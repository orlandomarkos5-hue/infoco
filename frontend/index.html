<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INFOCO</title>

<style>

body{
    margin:0;
    background:#050505;
    color:white;
    font-family:Arial, sans-serif;
}

header{
    background:#111;
    padding:15px;
    border-bottom:1px solid #333;
}

.logo{
    color:#ff6a00;
    font-size:28px;
    font-weight:bold;
}

.slogan{
    color:#ffffff;
    font-size:14px;
}

.container{
    display:flex;
    flex-wrap:wrap;
    padding:20px;
    gap:20px;
}

.video{
    flex:2;
    min-height:600px;
    background:#111;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:2px solid #ff6a00;
}

.chat{
    flex:1;
    min-height:600px;
    background:#111;
    border-radius:20px;
    padding:20px;
}

.banner{
    margin:20px;
    background:#111;
    border:1px solid #ff6a00;
    padding:20px;
    text-align:center;
    border-radius:15px;
}

.botoes{
    display:flex;
    gap:10px;
    margin-top:20px;
}

button{
    background:#ff6a00;
    color:white;
    border:none;
    padding:12px;
    border-radius:10px;
    cursor:pointer;
}

</style>

</head>

<body>

<header>
<div class="logo">INFOCO</div>
<div class="slogan">Mostre-se ao mundo</div>
</header>

<div class="container">

<div class="video">
<h1>ÁREA DE VÍDEO 9:16</h1>
</div>

<div class="chat">

<h2>💬 Chat ao Vivo</h2>

<p>Bem-vindo à INFOCO.</p>

<div class="botoes">
<button>Enviar Vídeo</button>
<button>Enviar Música</button>
</div>

</div>

</div>

<div class="banner">
BANNER INFOCO ADS
</div>

</body>

</html>
